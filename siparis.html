<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sipariş — Ali Baba Pide ve Lahmacun Salonu</title>
<meta name="description" content="Ali Baba Pide ve Lahmacun Salonu online sipariş." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { display: ['Fraunces','Georgia','serif'], sans: ['Manrope','system-ui','sans-serif'] },
  colors: { paper:'#f5ede0', ink:'#1f1410', clay:'#b85c38', ember:'#d97706', gold:'#c9a227', moss:'#5a6b4a', soot:'#2b1d17' }
}}};
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  * { -webkit-font-smoothing: antialiased; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Manrope', system-ui, sans-serif; background-color: #f5ede0; color: #1f1410; }
  .paper-bg { background-color: #f5ede0; background-image: var(--noise), radial-gradient(1200px 600px at 10% -10%, #e9d9bf 0%, transparent 60%), radial-gradient(900px 500px at 100% 20%, #ecdcc3 0%, transparent 55%); }
  .ink-bg { background-color: #1f1410; background-image: var(--noise); }
  .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
  .btn-clay { background: #b85c38; color: #f5ede0; transition: background .2s, transform .2s; }
  .btn-clay:hover { background: #9f4e2f; transform: translateY(-1px); }
  .product-row { transition: background .2s; }
  .product-row:hover { background: rgba(184,92,56,.06); }
</style>
</head>
<body class="paper-bg">

<!-- Üst bar -->
<div class="ink-bg text-paper text-center text-[12px] tracking-wider py-2.5 px-4">
  İnönü Mah. 381. Sok. No:26B, Bağcılar / İstanbul &nbsp;•&nbsp;
  <a href="tel:+902124330140" class="underline underline-offset-2 text-gold">0212 433 01 40</a>
  &nbsp;•&nbsp; Her gün açık 08:00 – 20:30
</div>

<header class="sticky top-0 z-40 bg-paper/90 backdrop-blur border-b border-ink/10">
  <div class="max-w-[900px] mx-auto px-4 h-[64px] flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <span class="w-10 h-10 rounded-full bg-clay text-paper flex items-center justify-center font-display text-xl shadow-md">A</span>
      <span>
        <span class="block font-display text-lg leading-none">Ali Baba</span>
        <span class="block text-[9px] tracking-[0.35em] uppercase text-ink/50 mt-1">Sipariş</span>
      </span>
    </a>
    <a href="index.html" class="text-xs tracking-[0.2em] uppercase text-ink/60 hover:text-clay">← Ana Sayfa</a>
  </div>
</header>

<main class="max-w-[900px] mx-auto px-4 py-6 pb-40">
  <div class="mb-6">
    <p class="text-[11px] tracking-[0.4em] uppercase text-clay">Sipariş</p>
    <h1 class="display text-3xl md:text-4xl mt-1">Ürünleri Seçin</h1>
    <p class="text-sm text-ink/60 mt-2">Adet seçin; seçtiğiniz ürünler alta eklenir. Fiyatı olmayan ürünler için lütfen arayın.</p>
  </div>

  <div id="productRows" class="space-y-2"></div>

  <!-- Müşteri bilgileri -->
  <div class="mt-8 bg-white rounded-2xl border border-ink/10 p-5">
    <h2 class="display text-xl mb-3">Teslimat Bilgileri</h2>
    <div class="grid md:grid-cols-2 gap-3 mb-3">
      <input id="custName" type="text" placeholder="Ad Soyad" class="px-4 py-3 rounded-xl border border-ink/15 bg-paper text-sm focus:outline-none focus:border-clay" />
      <input id="custPhone" type="tel" placeholder="Telefon" class="px-4 py-3 rounded-xl border border-ink/15 bg-paper text-sm focus:outline-none focus:border-clay" />
    </div>
    <input id="custAddress" type="text" placeholder="Adres / Teslimat notu" class="w-full px-4 py-3 rounded-xl border border-ink/15 bg-paper text-sm focus:outline-none focus:border-clay mb-3" />
    <textarea id="custNote" rows="2" placeholder="Ek not (isteğe bağlı)" class="w-full px-4 py-3 rounded-xl border border-ink/15 bg-paper text-sm focus:outline-none focus:border-clay"></textarea>
  </div>
</main>

<!-- Sabit alt bar -->
<div id="bottomBar" class="fixed bottom-0 left-0 right-0 z-50 hidden bg-ink text-paper border-t border-paper/10 shadow-2xl">
  <div class="max-w-[900px] mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="min-w-0">
      <p class="text-[10px] tracking-[0.3em] uppercase text-paper/50">Toplam</p>
      <p id="barTotal" class="display text-xl text-gold">0 ₺</p>
      <p id="barCount" class="text-xs text-paper/60 truncate">0 ürün</p>
    </div>
    <button type="button" onclick="sendOrder()" class="btn-clay px-6 py-3 rounded-full text-xs tracking-[0.2em] uppercase shadow-lg whitespace-nowrap">Siparişi Tamamla</button>
  </div>
</div>

<script>
  const MENU = [
    {cat:'Lahmacunlar', name:'Lahmacun', price:80, img:'https://images.pexels.com/photos/24427085/pexels-photo-24427085.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Lahmacunlar', name:'Malatya Lahmacun', price:150, img:'https://images.pexels.com/photos/7545570/pexels-photo-7545570.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Kıymalı Pide', price:150, img:'https://images.pexels.com/photos/5639357/pexels-photo-5639357.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Kıymalı Kaşarlı Pide', price:200, img:'https://images.pexels.com/photos/37290083/pexels-photo-37290083.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Kavurmalı Pide', price:null, img:'https://images.pexels.com/photos/5639357/pexels-photo-5639357.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Kavurmalı Kaşarlı Pide', price:225, img:'https://images.pexels.com/photos/37290083/pexels-photo-37290083.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Kavurmalı Yumurtalı Pide', price:225, img:'https://images.pexels.com/photos/37290083/pexels-photo-37290083.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Karışık Pide', price:225, img:'https://images.pexels.com/photos/5639357/pexels-photo-5639357.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Kaşarlı Pide', price:175, img:'https://images.pexels.com/photos/37290083/pexels-photo-37290083.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Kaşarlı Sucuklu Pide', price:200, img:'https://images.pexels.com/photos/5639357/pexels-photo-5639357.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Pideler', name:'Sucuklu Yumurtalı Pide', price:150, img:'https://images.pexels.com/photos/5639357/pexels-photo-5639357.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Katmerler', name:'Kıymalı Katmer', price:30, img:'https://images.pexels.com/photos/37290080/pexels-photo-37290080.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Katmerler', name:'Sucuklu Katmer', price:30, img:'https://images.pexels.com/photos/37290080/pexels-photo-37290080.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Katmerler', name:'Peynirli Katmer', price:30, img:'https://images.pexels.com/photos/37290080/pexels-photo-37290080.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Katmerler', name:'Patatesli Katmer', price:30, img:'https://images.pexels.com/photos/37290080/pexels-photo-37290080.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Katmerler', name:'Yağlı Katmer', price:25, img:'https://images.pexels.com/photos/37290080/pexels-photo-37290080.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Katmerler', name:'Tırnaklı / Evcil Pide', price:20, img:'https://images.pexels.com/photos/37290088/pexels-photo-37290088.jpeg?auto=compress&cs=tinysrgb&w=200'},
    {cat:'Katmerler', name:'Lavaş', price:20, img:'https://images.pexels.com/photos/37290088/pexels-photo-37290088.jpeg?auto=compress&cs=tinysrgb&w=200'}
  ];
  const qty = {};
  MENU.forEach(m => qty[m.name] = 0);

  function render() {
    const root = document.getElementById('productRows');
    const cats = [...new Set(MENU.map(m=>m.cat))];
    root.innerHTML = cats.map(cat => `
      <div class="mb-6">
        <p class="text-[10px] tracking-[0.35em] uppercase text-clay mb-2">${cat}</p>
        <div class="bg-white rounded-2xl border border-ink/10 overflow-hidden divide-y divide-ink/10">
          ${MENU.filter(m=>m.cat===cat).map(m => `
            <div class="product-row flex items-center gap-3 p-3">
              <img src="${m.img}" alt="${m.name}" class="w-14 h-14 rounded-xl object-cover shrink-0 bg-soot" loading="eager" onerror="this.style.display='none'" />
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-ink truncate">${m.name}</p>
                <p class="text-xs text-ink/50">${m.price ? m.price + ' ₺' : 'Fiyat sorunuz'}</p>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button type="button" onclick="chg('${m.name}',-1)" class="w-9 h-9 rounded-full bg-ink/5 hover:bg-ink/10 flex items-center justify-center text-ink text-lg">−</button>
                <span id="q_${m.name}" class="w-7 text-center text-sm font-medium">${qty[m.name]}</span>
                <button type="button" onclick="chg('${m.name}',1)" class="w-9 h-9 rounded-full bg-clay text-paper hover:bg-[#9f4e2f] flex items-center justify-center text-lg">+</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
    updateBar();
  }

  function chg(name, d) {
    qty[name] = Math.max(0, (qty[name]||0) + d);
    const el = document.getElementById('q_' + name);
    if (el) el.textContent = qty[name];
    updateBar();
  }

  function updateBar() {
    let total = 0, count = 0;
    MENU.forEach(m => { if (qty[m.name]) { count += qty[m.name]; if (m.price) total += m.price * qty[m.name]; } });
    const bar = document.getElementById('bottomBar');
    if (count > 0) {
      bar.classList.remove('hidden');
      document.getElementById('barTotal').textContent = total ? total + ' ₺' : 'Fiyat sorunuz';
      document.getElementById('barCount').textContent = count + ' ürün seçildi';
    } else {
      bar.classList.add('hidden');
    }
  }

  function clearOrder() {
    MENU.forEach(m => qty[m.name]=0);
    render();
  }

  function sendOrder() {
    const lines = MENU.filter(m=>qty[m.name]>0).map(m => `• ${m.name} x${qty[m.name]}${m.price ? ' — ' + (m.price*qty[m.name]) + ' ₺' : ''}`);
    if (!lines.length) { alert('Lütfen en az bir ürün seçin.'); return; }
    const total = MENU.reduce((s,m)=> s + (m.price && qty[m.name] ? m.price*qty[m.name] : 0), 0);
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const address = document.getElementById('custAddress').value.trim();
    const note = document.getElementById('custNote').value.trim();
    let msg = 'Merhaba, sipariş vermek istiyorum:\n\n' + lines.join('\n');
    if (total) msg += '\n\nToplam: ' + total + ' ₺';
    if (name) msg += '\n\nAd Soyad: ' + name;
    if (phone) msg += '\nTelefon: ' + phone;
    if (address) msg += '\nAdres: ' + address;
    if (note) msg += '\nNot: ' + note;
    const url = 'https://wa.me/902124330140?text=' + encodeURIComponent(msg);
    window.open(url, '_blank');
  }

  render();
</script>
</body>
</html>
